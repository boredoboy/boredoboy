name: Update YouTube Stats

on:
  schedule:
    - cron: "0 0 * * *" # Робот запускается в 00:00
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Python Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python update_youtube.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md youtube_stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Обновлена статистика YouTube" && git push)
